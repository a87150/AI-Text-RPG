[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voco-qwen3-tts"
version = "0.1.0"
description = "Qwen3-TTS plugin for voco"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."voco.plugins"]
qwen3-tts = "voco_qwen3_tts"

[tool.setuptools]
packages = ["voco_qwen3_tts"]
